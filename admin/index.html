<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin — Nusrat Afsana Usha</title>

  <meta
    name="description"
    content="Secure administration panel for Nusrat Afsana Usha portfolio."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./admin.css">

  <style>
    :root{
      --login-bg:#09090b;
      --login-panel:rgba(21,22,26,.88);
      --login-border:rgba(255,255,255,.09);
      --login-text:#f6f3ec;
      --login-muted:#9999a1;
      --login-accent:#d8b36a;
      --login-accent-soft:rgba(216,179,106,.12);
      --danger:#e87878;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      min-height:100%;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(216,179,106,.09),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(255,255,255,.035),
          transparent 28%
        ),
        var(--login-bg);
      color:var(--login-text);
      font-family:"Instrument Sans",sans-serif;
      overflow-x:hidden;
    }

    button,
    input{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .login-shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:30px;
      position:relative;
      overflow:hidden;
    }

    .ambient{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }

    .ambient::before,
    .ambient::after{
      content:"";
      position:absolute;
      border-radius:999px;
      filter:blur(100px);
      opacity:.18;
    }

    .ambient::before{
      width:360px;
      height:360px;
      left:-150px;
      top:-120px;
      background:#d8b36a;
    }

    .ambient::after{
      width:300px;
      height:300px;
      right:-120px;
      bottom:-100px;
      background:#7c6b4e;
    }

    .login-container{
      width:min(100%,460px);
      position:relative;
      z-index:2;
    }

    .brand{
      display:flex;
      justify-content:center;
      margin-bottom:28px;
    }

    .brand-mark{
      width:58px;
      height:58px;
      border:1px solid rgba(216,179,106,.38);
      background:
        linear-gradient(
          145deg,
          rgba(216,179,106,.14),
          rgba(255,255,255,.025)
        );
      border-radius:20px;
      display:grid;
      place-items:center;
      box-shadow:
        0 20px 70px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .brand-mark span{
      font-family:"Bricolage Grotesque",sans-serif;
      font-size:20px;
      font-weight:700;
      letter-spacing:-.06em;
      color:var(--login-accent);
    }

    .login-card{
      border:1px solid var(--login-border);
      background:var(--login-panel);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      border-radius:30px;
      padding:38px;
      box-shadow:
        0 35px 100px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.045);
    }

    .eyebrow{
      text-align:center;
      color:var(--login-accent);
      text-transform:uppercase;
      letter-spacing:.18em;
      font-size:10px;
      font-weight:700;
      margin-bottom:12px;
    }

    .title{
      text-align:center;
      font-family:"Bricolage Grotesque",sans-serif;
      font-size:clamp(34px,7vw,48px);
      line-height:.95;
      letter-spacing:-.055em;
      margin-bottom:14px;
    }

    .subtitle{
      max-width:350px;
      margin:0 auto 30px;
      text-align:center;
      color:var(--login-muted);
      font-size:14px;
      line-height:1.65;
    }

    .field{
      margin-bottom:18px;
    }

    .field label{
      display:block;
      color:#d8d5ce;
      font-size:12px;
      font-weight:600;
      margin-bottom:8px;
    }

    .input-wrap{
      position:relative;
    }

    .input{
      width:100%;
      height:54px;
      border-radius:15px;
      border:1px solid rgba(255,255,255,.09);
      outline:none;
      background:rgba(255,255,255,.035);
      color:var(--login-text);
      padding:0 16px;
      transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .input.password{
      padding-right:52px;
    }

    .input::placeholder{
      color:#68686f;
    }

    .input:focus{
      border-color:rgba(216,179,106,.65);
      background:rgba(216,179,106,.045);
      box-shadow:
        0 0 0 4px rgba(216,179,106,.08);
    }

    .password-toggle{
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);
      width:38px;
      height:38px;
      border:0;
      border-radius:11px;
      color:#aaa8a2;
      background:transparent;
      display:grid;
      place-items:center;
    }

    .password-toggle:hover{
      color:#fff;
      background:rgba(255,255,255,.06);
    }

    .login-options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin:4px 0 22px;
    }

    .remember{
      display:flex;
      align-items:center;
      gap:9px;
      color:#a5a4a0;
      font-size:12px;
      cursor:pointer;
      user-select:none;
    }

    .remember input{
      width:15px;
      height:15px;
      accent-color:var(--login-accent);
      cursor:pointer;
    }

    .secure-label{
      color:#77777e;
      font-size:11px;
      display:flex;
      align-items:center;
      gap:6px;
    }

    .secure-dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:#7dbb91;
      box-shadow:0 0 12px rgba(125,187,145,.5);
    }

    .login-button{
      width:100%;
      height:56px;
      border:0;
      border-radius:16px;
      color:#16130d;
      background:
        linear-gradient(
          135deg,
          #e5c886,
          #caa35e
        );
      font-weight:700;
      letter-spacing:-.01em;
      box-shadow:
        0 15px 35px rgba(216,179,106,.16),
        inset 0 1px 0 rgba(255,255,255,.35);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
    }

    .login-button:hover{
      transform:translateY(-2px);
      filter:brightness(1.04);
      box-shadow:
        0 20px 42px rgba(216,179,106,.22),
        inset 0 1px 0 rgba(255,255,255,.35);
    }

    .login-button:active{
      transform:translateY(0);
    }

    .login-button.loading{
      opacity:.72;
      pointer-events:none;
    }

    .error-box{
      display:none;
      margin-top:16px;
      padding:13px 15px;
      border-radius:13px;
      border:1px solid rgba(232,120,120,.2);
      background:rgba(232,120,120,.07);
      color:#eaa0a0;
      font-size:12px;
      line-height:1.5;
    }

    .error-box.show{
      display:block;
    }

    .footer{
      text-align:center;
      margin-top:22px;
      color:#68686f;
      font-size:11px;
      line-height:1.6;
    }

    .footer strong{
      color:#929098;
      font-weight:500;
    }

    .theme-button{
      position:fixed;
      top:24px;
      right:24px;
      width:42px;
      height:42px;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(255,255,255,.04);
      color:#b5b3ae;
      display:grid;
      place-items:center;
      z-index:10;
      transition:.2s ease;
    }

    .theme-button:hover{
      color:#fff;
      border-color:rgba(216,179,106,.4);
      background:rgba(216,179,106,.08);
    }

    .theme-button svg{
      width:17px;
      height:17px;
    }

    body.light{
      --login-bg:#f1eee7;
      --login-panel:rgba(255,255,255,.88);
      --login-border:rgba(20,20,20,.09);
      --login-text:#181715;
      --login-muted:#68665f;
    }

    body.light .input{
      color:#181715;
      background:rgba(0,0,0,.025);
      border-color:rgba(0,0,0,.09);
    }

    body.light .input::placeholder{
      color:#99958c;
    }

    body.light .field label{
      color:#44413b;
    }

    body.light .secure-label,
    body.light .footer{
      color:#89857d;
    }

    body.light .password-toggle{
      color:#77736b;
    }

    @media(max-width:600px){

      .login-shell{
        padding:20px;
      }

      .theme-button{
        top:15px;
        right:15px;
      }

      .login-card{
        padding:28px 22px;
        border-radius:24px;
      }

      .title{
        font-size:39px;
      }

      .login-options{
        align-items:flex-start;
        flex-direction:column;
      }

      .secure-label{
        display:none;
      }
    }

    @media(prefers-reduced-motion:reduce){

      *,
      *::before,
      *::after{
        scroll-behavior:auto!important;
        transition:none!important;
      }
    }
  </style>
</head>

<body>

  <div class="ambient"></div>

  <!-- Theme -->
  <button
    class="theme-button"
    id="themeButton"
    type="button"
    aria-label="Toggle theme"
    title="Toggle theme"
  >
    <svg
      id="themeIcon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2"></path>
      <path d="M12 20v2"></path>
      <path d="m4.93 4.93 1.42 1.42"></path>
      <path d="m17.65 17.65 1.42 1.42"></path>
      <path d="M2 12h2"></path>
      <path d="M20 12h2"></path>
      <path d="m6.35 17.65-1.42 1.42"></path>
      <path d="m19.07 4.93-1.42 1.42"></path>
    </svg>
  </button>


  <main class="login-shell">

    <section class="login-container">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-mark">
          <span>NU</span>
        </div>
      </div>


      <!-- Login Card -->
      <div class="login-card">

        <div class="eyebrow">
          Portfolio Administration
        </div>

        <h1 class="title">
          Welcome back.
        </h1>

        <p class="subtitle">
          Sign in to manage portfolio content,
          projects, banners and newsletter settings.
        </p>


        <form
          id="loginForm"
          autocomplete="on"
          novalidate
        >

          <!-- Email -->
          <div class="field">

            <label for="email">
              Email Address
            </label>

            <div class="input-wrap">

              <input
                class="input"
                id="email"
                name="email"
                type="email"
                placeholder="admin@nusratafsana.com"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
              >

            </div>

          </div>


          <!-- Password -->
          <div class="field">

            <label for="password">
              Password
            </label>

            <div class="input-wrap">

              <input
                class="input password"
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="Show password"
              >
                <svg
                  id="eyeIcon"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                  <circle cx="12" cy="12" r="2.7"></circle>
                </svg>
              </button>

            </div>

          </div>


          <!-- Options -->
          <div class="login-options">

            <label class="remember">

              <input
                type="checkbox"
                id="remember"
              >

              <span>
                Remember this device
              </span>

            </label>

            <span class="secure-label">

              <span class="secure-dot"></span>

              Secure session

            </span>

          </div>


          <!-- Login -->
          <button
            class="login-button"
            id="loginButton"
            type="submit"
          >
            <span id="loginButtonText">
              Continue to Admin
            </span>
          </button>


          <!-- Error -->
          <div
            class="error-box"
            id="errorBox"
            role="alert"
          ></div>

        </form>

      </div>


      <!-- Footer -->
      <div class="footer">

        <strong>
          Nusrat Afsana Usha
        </strong>

        · Portfolio Administration

      </div>

    </section>

  </main>


<script>
/* =========================================================
   NUSRAT AFSANA USHA
   ADMIN AUTHENTICATION
   ========================================================= */

const CONFIG = {

  sessionKey:
    "nusrat_admin_session_v1",

  rememberKey:
    "nusrat_admin_remember_v1",

  themeKey:
    "nusrat_admin_theme",

  sessionHours: 8,


  /*
   * DEMO ADMIN
   */

  admin: {

    email:
      "admin@nusratafsana.com",

    password:
      "demo123",

    role:
      "admin",

    redirect:
      "./dashboard.html"

  },


  /*
   * PRIVATE SUPER ADMIN
   */

  superAdmin: {

    email:
      "master@nusratafsana.com",

    password:
      "SNK@Master2026!",

    role:
      "super_admin",

    redirect:
      "./master/index.html"

  }

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const rememberInput =
  document.getElementById("remember");

const loginButton =
  document.getElementById("loginButton");

const loginButtonText =
  document.getElementById("loginButtonText");

const errorBox =
  document.getElementById("errorBox");

const passwordToggle =
  document.getElementById("passwordToggle");

const themeButton =
  document.getElementById("themeButton");


/* =========================================================
   STORAGE
   ========================================================= */

function getJSON(key, fallback = null){

  try{

    const value =
      localStorage.getItem(key);

    if(!value){
      return fallback;
    }

    return JSON.parse(value);

  }catch(error){

    return fallback;

  }

}


function setJSON(key, value){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(message){

  errorBox.textContent =
    message;

  errorBox.classList.add(
    "show"
  );

}


function hideError(){

  errorBox.textContent =
    "";

  errorBox.classList.remove(
    "show"
  );

}


/* =========================================================
   SESSION
   ========================================================= */

function getExistingSession(){

  const session =
    getJSON(
      CONFIG.sessionKey,
      null
    );

  if(!session){
    return null;
  }


  if(
    session.authenticated === true &&
    Number(session.expiresAt) > Date.now()
  ){

    return session;

  }


  localStorage.removeItem(
    CONFIG.sessionKey
  );

  return null;

}


function redirectExistingSession(){

  const session =
    getExistingSession();

  if(!session){
    return;
  }


  if(
    session.role ===
    "super_admin"
  ){

    window.location.replace(
      CONFIG.superAdmin.redirect
    );

    return;

  }


  window.location.replace(
    CONFIG.admin.redirect
  );

}


/* =========================================================
   REMEMBER
   ========================================================= */

function loadRemember(){

  rememberInput.checked =
    localStorage.getItem(
      CONFIG.rememberKey
    ) === "true";

}


function saveRemember(){

  localStorage.setItem(
    CONFIG.rememberKey,
    rememberInput.checked
      ? "true"
      : "false"
  );

}


/* =========================================================
   THEME
   ========================================================= */

function applyTheme(theme){

  const light =
    theme === "light";

  document.body.classList.toggle(
    "light",
    light
  );

  localStorage.setItem(
    CONFIG.themeKey,
    light
      ? "light"
      : "dark"
  );

}


function loadTheme(){

  const saved =
    localStorage.getItem(
      CONFIG.themeKey
    );

  applyTheme(
    saved === "light"
      ? "light"
      : "dark"
  );

}


themeButton.addEventListener(
  "click",
  () => {

    const next =
      document.body.classList.contains(
        "light"
      )
        ? "dark"
        : "light";

    applyTheme(next);

  }
);


/* =========================================================
   PASSWORD SHOW / HIDE
   ========================================================= */

passwordToggle.addEventListener(
  "click",
  () => {

    const isPassword =
      passwordInput.type ===
      "password";


    passwordInput.type =
      isPassword
        ? "text"
        : "password";


    passwordToggle.setAttribute(
      "aria-label",
      isPassword
        ? "Hide password"
        : "Show password"
    );

  }
);


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    hideError();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;


    /* Validation */

    if(!email){

      showError(
        "Please enter your email address."
      );

      emailInput.focus();

      return;

    }


    if(!password){

      showError(
        "Please enter your password."
      );

      passwordInput.focus();

      return;

    }


    if(
      !email.includes("@")
    ){

      showError(
        "Please enter a valid email address."
      );

      emailInput.focus();

      return;

    }


    /* Loading */

    loginButton.classList.add(
      "loading"
    );

    loginButtonText.textContent =
      "Authenticating…";


    await new Promise(
      resolve =>
        setTimeout(resolve, 450)
    );


    /* Find account */

    let account = null;


    if(
      email ===
        CONFIG.admin.email &&
      password ===
        CONFIG.admin.password
    ){

      account =
        CONFIG.admin;

    }


    else if(
      email ===
        CONFIG.superAdmin.email &&
      password ===
        CONFIG.superAdmin.password
    ){

      account =
        CONFIG.superAdmin;

    }


    /* Invalid */

    if(!account){

      loginButton.classList.remove(
        "loading"
      );

      loginButtonText.textContent =
        "Continue to Admin";


      showError(
        "The email address or password is incorrect."
      );


      passwordInput.select();

      return;

    }


    /* Remember */

    saveRemember();


    /* Session */

    const now =
      Date.now();

    const sessionDuration =
      CONFIG.sessionHours *
      60 *
      60 *
      1000;


    const session = {

      authenticated:
        true,

      role:
        account.role,

      loginAt:
        new Date(now)
          .toISOString(),

      expiresAt:
        now +
        sessionDuration

    };


    setJSON(
      CONFIG.sessionKey,
      session
    );


    /* Success */

    loginButtonText.textContent =
      "Access granted";


    await new Promise(
      resolve =>
        setTimeout(resolve, 350)
    );


    /* Redirect */

    window.location.replace(
      account.redirect
    );

  }
);


/* =========================================================
   ENTER KEY
   ========================================================= */

emailInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      event.preventDefault();

      passwordInput.focus();

    }

  }
);


/* =========================================================
   EXPIRED SESSION CLEANUP
   ========================================================= */

function cleanExpiredSession(){

  const session =
    getJSON(
      CONFIG.sessionKey,
      null
    );

  if(!session){
    return;
  }


  if(
    Number(session.expiresAt) <=
    Date.now()
  ){

    localStorage.removeItem(
      CONFIG.sessionKey
    );

  }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

(function init(){

  loadTheme();

  loadRemember();

  cleanExpiredSession();


  const session =
    getExistingSession();


  if(session){

    redirectExistingSession();

    return;

  }


  emailInput.focus();

})();
</script>

</body>
</html>
